schema: spec-driven

context: |
  ABP AG-UI Lab is a local integration sample with a .NET server,
  a .NET console consumer, and an Angular UI. The server's mock mode
  produces deterministic AG-UI server-sent events without a provider key.
  Prefer mock mode for repeatable acceptance checks.

rules:
  specs:
    - Give each scenario a distinct name and an observable expected result.
  tasks:
    - Include the commands or steps needed to verify each scenario.
